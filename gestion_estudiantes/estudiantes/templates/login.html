<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #a9c4cf;
        }

        .contenedor {
            height: 100vh;
        }

        .lado-izquierdo {
            background: linear-gradient(to right, #0f7c82, #0c5c60);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .lado-derecho {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .btn-custom {
            background-color: #0c5c60;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #084447;
        }
    </style>
</head>

<body>

<div class="container-fluid contenedor">
    <div class="row h-100">

        <!-- IZQUIERDA -->
        <div class="col-md-6 lado-izquierdo">
            <h2>
                DESARROLLO DE UN ENTORNO VIRTUAL DE APRENDIZAJE (EVA)
            </h2>
        </div>

        <!-- DERECHA -->
        <div class="col-md-6 lado-derecho">

            <div class="login-box">

                <h3 class="text-center mb-4">INICIO DE SESIÓN</h3>

                <form method="POST">
                    {% csrf_token %}

                    <input type="email" name="correo" placeholder="Correo electrónico"
                        class="form-control mb-3" required>

                    <input type="password" name="password" placeholder="Contraseña"
                        class="form-control mb-3" required>

                    <button type="submit" class="btn btn-custom w-100">
                        ACCEDER
                    </button>
                </form>

                {% if error %}
                    <p class="text-danger mt-3 text-center">{{ error }}</p>
                {% endif %}

                <div class="text-center mt-3">
                    <a href="/registro/">Regístrate</a>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
<a href="/registro/">Regístrate</a>
