<!DOCTYPE html>
<html>
<head>
    <title>Agregar estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h1 class="text-primary">Agregar estudiante</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="nombre" placeholder="Nombre" class="form-control mb-2">

        <input type="text" name="apellido" placeholder="Apellido" class="form-control mb-2">

        <input type="number" name="edad" placeholder="Edad" class="form-control mb-2">

        <input type="email" name="correo" placeholder="Correo" class="form-control mb-2">

        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

</body>
</html>
